[project]
name = "hippocampus-foundation"
version = "0.1.0"
description = "Clean-room governance and deterministic data preparation for Hippocampus Foundation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "google-api-python-client>=2.179,<3",
  "google-auth>=2.40,<3",
  "jsonschema>=4.23,<5",
  "rfc8785>=0.1.4,<1",
]

[project.scripts]
hf-phase0 = "hippocampus_foundation.phase0.cli:main"
hf-phase1 = "hippocampus_foundation.phase1.cli:main"
hf-phase2 = "hippocampus_foundation.phase2.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.130,<7",
  "pytest>=8.3,<9",
  "ruff==0.16.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hippocampus_foundation"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "hippocampus_foundation/schemas"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
